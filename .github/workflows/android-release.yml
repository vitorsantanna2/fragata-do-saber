name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check Supabase configuration
        run: |
          test -n "$VITE_SUPABASE_URL" || (echo "::error::Configure VITE_SUPABASE_URL in repository Actions variables." && exit 1)
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || (echo "::error::Configure VITE_SUPABASE_PUBLISHABLE_KEY in repository Actions variables." && exit 1)

      - name: Install web dependencies
        run: npm ci

      - name: Validate web app
        run: |
          npm run lint
          npm test

      - name: Build web app and sync Android
        run: npm run android:sync

      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Configure the repository secret $name."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fragata-release.jks"
          test -s "$RUNNER_TEMP/fragata-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/fragata-release.jks" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" > /dev/null
          printf 'ANDROID_KEYSTORE_PATH=%s/fragata-release.jks\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Build signed Android APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --no-configuration-cache assembleRelease

      - name: Verify APK signature
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk

      - name: Upload signed APK for manual validation
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: fragata-do-saber-signed-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Create GitHub release and upload APK
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const tag = context.ref.replace(/^refs\/tags\//, '');
            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Fragata do Saber ${tag}`,
              body: fs.existsSync(`releases/${tag}.md`) ? fs.readFileSync(`releases/${tag}.md`, 'utf8') : [
                'APK beta do Fragata do Saber para Android.',
                '',
                '- Inclui questões do Supabase e cache local SQLite.',
                '- APK de release assinado com a chave permanente do aplicativo, para instalação direta.',
                '- Na migração de um APK antigo de depuração, pode ser necessário desinstalar a versão anterior. Sincronize seu progresso antes: desinstalar apaga os dados locais.',
              ].join('\n'),
              draft: true,
              prerelease: true,
            });

            const apkPath = 'android/app/build/outputs/apk/release/app-release.apk';
            const apk = fs.readFileSync(apkPath);
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              name: `fragata-do-saber-${tag}.apk`,
              data: apk,
              headers: {
                'content-type': 'application/vnd.android.package-archive',
                'content-length': apk.length,
              },
            });

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              draft: false,
            });

      - name: Remove temporary keystore
        if: always()
        run: rm -f -- "$RUNNER_TEMP/fragata-release.jks"
